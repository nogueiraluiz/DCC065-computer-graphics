<!DOCTYPE html>
<html lang="pt-BR">

<head>
   <title>Hello Kitty Flight Simulator</title>

   <link rel="shortcut icon" href="../favicon.ico">
   <link rel="stylesheet" href="../html/resources/default.css">
   <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
   <style>
     /* Impede scroll e zoom por toque no mobile */
     body { touch-action: none; }
   </style>
</head>

<body>
   <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
   <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
   <script type="importmap">
         {"imports": {"three": "../build/three.module.js"}}
      </script>

   <div id="loading-screen" style="
      position: fixed; inset: 0; z-index: 9999;
      background: rgb(148, 181, 224);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
      transition: opacity 0.5s ease;
   ">
      <div style="font-size: 14px; font-weight: 900; color: #ffffff; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px;">Bem-vindo ao</div>
      <div style="font-size: 38px; font-weight: 900; color: #1f6494; line-height: 1; margin-bottom: 4px;">HELLO KITTY</div>
      <div style="font-size: 28px; font-weight: 900; color: #e06187; margin-bottom: 36px;">WORLD</div>
      <div style="width: 220px; height: 14px; background: rgba(255,255,255,0.45); border-radius: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,0.75); margin-bottom: 12px;">
         <div id="loading-bar" style="width: 5%; height: 100%; background: #f2d925; border-radius: 8px; transition: width 0.35s ease;"></div>
      </div>
      <div id="loading-text" style="font-size: 11px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 1.5px;">Carregando...</div>
   </div>

   <div id="webgl-output">
      <script type="module" src="main.js"></script>
   </div>
</body>

</html>
